name: Deploy to WordPress.org

on:
  # A release published by hand on GitHub.
  release:
    types:
      - published
  # Called by release-please.yml after merging a release PR (a release created
  # by GitHub Actions does not fire the "published" event).
  workflow_call:
    inputs:
      tag:
        type: string
        description: 'Release tag to deploy, e.g. 0.1.7'
        required: true
      dry-run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: 'Release tag to deploy, e.g. 0.1.7 (empty: the selected ref)'
        required: false
      dry-run:
        type: boolean
        description: 'Dry run: build and prepare the SVN commit, but publish nothing to WordPress.org or the GitHub Release.'
        default: false

permissions: {}

jobs:
  deploy:
    name: Deploy to WordPress.org
    # A GitHub prerelease (beta, RC) never reaches WordPress.org, which has no
    # beta channel: anything committed there is a real version.
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    env:
      # The tag from the caller, the published release, or the selected ref.
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install Composer dependencies (Production)
        run: |
          composer install --no-dev --optimize-autoloader
          rm -rf vendor/bin
          find vendor -type d \( -name "tests" -o -name "test" -o -name "docs" -o -name "doc" -o -name "examples" -o -name "demo" -o -name ".github" \) -exec rm -rf {} + || true
          find vendor -type f \( -name "*.py" -o -name "*.sh" -o -name "*.bat" -o -name "*.cmd" -o -name "*.exe" -o -name "*.bin" -o -name "*.dylib" -o -name "*.so" -o -name "*.neon" -o -name "*.dist" -o -name "*.sample" -o -name ".DS_Store" -o -name "Thumbs.db" -o -name ".editorconfig" -o -name ".git*" \) -delete || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install SVN
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Clean non-asset files and sources
        run: |
          rm -rf .wordpress-org/sources
          rm -f .wordpress-org/*.svg
          find .wordpress-org -name ".DS_Store" -delete || true

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
          dry-run: ${{ inputs.dry-run || false }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          VERSION: ${{ env.TAG }}

      - name: List what would be deployed
        if: ${{ inputs.dry-run }}
        env:
          ZIP: ${{ steps.deploy.outputs.zip-path }}
        run: |
          {
            echo "### Dry run: nothing was published"
            echo ""
            echo "Files at the top level of the plugin (vendor/, build/, includes/ and assets/ left out):"
            echo '```'
            unzip -Z1 "$ZIP" | grep -v '/$' | sed 's#^[^/]*/##' | grep -v -E '^(vendor|build|includes|assets)/'
            echo '```'
            echo "Total files: $(unzip -Z1 "$ZIP" | grep -c -v '/$')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release asset
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ steps.deploy.outputs.zip-path }}

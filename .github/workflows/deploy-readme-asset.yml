name: Plugin asset/readme update

on:
  push:
    branches:
      - assets
    paths:
      - readme.txt
      - .wordpress-org/**
  workflow_dispatch:

permissions: {}

jobs:
  assets:
    name: Plugin asset/readme update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clean non-asset files and sources
        run: |
          rm -rf .wordpress-org/sources
          rm -f .wordpress-org/*.svg
          find .wordpress-org -name ".DS_Store" -delete || true

      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          IGNORE_OTHER_FILES: true

name: Plugin asset/readme update

on:
  push:
    branches:
      - main
      - assets
    paths:
      - readme.txt
      - .wordpress-org/**
  workflow_dispatch:
    inputs:
      slug:
        description: 'WordPress.org plugin slug (leave empty to use repository name)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  assets:
    name: Plugin asset/readme update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean non-asset files and sources
        run: |
          rm -rf .wordpress-org/sources
          rm -f .wordpress-org/*.svg

      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ${{ github.event.inputs.slug }}
          IGNORE_OTHER_FILES: true

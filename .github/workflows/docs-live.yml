name: Docs fixes back to main

# `docs-live` is Vercel's production branch: the docs of the released plugin.
# A docs fix merged into it goes live at once; this brings it into main too,
# so the next release (which fast-forwards docs-live to main) keeps it.
# A merge commit, never a squash: main must contain docs-live's commits for
# that fast-forward. On a conflict it opens a pull request instead.
on:
  push:
    branches: [docs-live]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  merge-into-main:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Merge docs-live into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin docs-live
          if git merge-base --is-ancestor origin/docs-live HEAD; then
            echo "main already has everything on docs-live (a release moved it)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-ff origin/docs-live -m "docs: bring docs-live fixes into main"; then
            git push origin HEAD:main
          else
            git merge --abort
            if [ -z "$(gh pr list --head docs-live --base main --state open --json number --jq '.[0].number')" ]; then
              gh pr create --head docs-live --base main \
                --title "docs: bring docs-live fixes into main" \
                --body "A docs fix on docs-live conflicts with main. Resolve, then merge with a **merge commit** (not squash), so the next release can move docs-live forward."
            fi
          fi

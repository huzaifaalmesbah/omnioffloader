name: Milestones

# A PR merged into main without a milestone joins the next release: the open
# milestone with the lowest version number. release-please.yml closes that
# milestone when the version ships. Release PRs are left alone.
# pull_request_target: setting a milestone needs a write token, which a
# fork's pull_request run doesn't get. Safe here: no checkout, and PR data is
# only read through the API, never put in a shell command.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  assign:
    if: ${{ github.event.pull_request.merged && !github.event.pull_request.milestone && !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const milestones = await github.paginate( github.rest.issues.listMilestones, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            } );
            const parse = ( title ) => title.split( '.' ).map( Number );
            const next = milestones
              .filter( ( m ) => /^\d+\.\d+\.\d+$/.test( m.title ) )
              .sort( ( a, b ) => {
                const [ x, y ] = [ parse( a.title ), parse( b.title ) ];
                return x[ 0 ] - y[ 0 ] || x[ 1 ] - y[ 1 ] || x[ 2 ] - y[ 2 ];
              } )[ 0 ];
            if ( ! next ) {
              core.info( 'No open version milestone.' );
              return;
            }
            await github.rest.issues.update( {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              milestone: next.number,
            } );
            core.info( `Added #${ context.payload.pull_request.number } to milestone ${ next.title }.` );

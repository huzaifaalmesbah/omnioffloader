name: PR title

# Release Please builds the version bump and CHANGELOG.md from commit
# messages, and a squash merge uses the PR title as the commit message. A
# title it can't read ("0.1.6: …") is left out of the release, so check it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            build
            docs
            style
            chore
            refactor
            test
            ci
          requireScope: false

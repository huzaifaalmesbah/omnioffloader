name: Release Please

# On every push to main, Release Please keeps one open "chore: release x.y.z"
# PR up to date with the changes since the last release. Merging that PR is
# the release: it tags, creates the GitHub Release and deploys to WordPress.org.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a run in flight: a cancelled run could leave a release tagged
# on GitHub but never deployed to WordPress.org.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # Needs the repo setting "Allow GitHub Actions to create and approve pull requests".
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Release Please bumps only the manifest and CHANGELOG.md. WordPress reads
  # the version from the plugin header, OMNIOFFLOADER_VERSION, readme.txt's
  # Stable tag and package.json, and readme.txt's "= Unreleased =" entries
  # become this version: scripts/sync-versions.mjs does all of that.
  sync-versions:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Keeps its credentials: it pushes the synced versions to the release PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Sync versions and the readme changelog
        run: node scripts/sync-versions.mjs
      - name: Commit to the release PR
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore: sync versions and readme changelog"
            git push
          fi

  # The milestone named after the version is done once it ships.
  close-milestone:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        with:
          script: |
            const milestones = await github.paginate( github.rest.issues.listMilestones, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            } );
            const milestone = milestones.find( ( m ) => m.title === process.env.VERSION );
            if ( ! milestone ) {
              core.info( `No open milestone named ${ process.env.VERSION }.` );
              return;
            }
            await github.rest.issues.updateMilestone( {
              owner: context.repo.owner,
              repo: context.repo.repo,
              milestone_number: milestone.number,
              state: 'closed',
            } );
            core.info( `Closed milestone ${ milestone.title }.` );

  # The public docs (Vercel's production branch `docs-live`) follow releases:
  # docs merged into main for unreleased features go live only now.
  # Fast-forward only: docs fixes made on docs-live are merged into main by
  # docs-live.yml, so a failure here means one was not — never overwrite it.
  publish-docs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Keeps its credentials: it pushes docs-live.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - name: Move docs-live to the release
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          git push origin "${SHA}:refs/heads/docs-live"

  # A release created with GITHUB_TOKEN does not fire the "release published"
  # event, so the deploy is called here instead of waiting for that event.
  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-on-pushing-plugin.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

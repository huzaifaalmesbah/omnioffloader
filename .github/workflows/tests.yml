name: Tests

# Static checks plus the integration tests (tests/integration-*.php) on a
# real WordPress install, across the PHP and WordPress versions the plugin
# supports. The tests use tests/MockProvider.php: no credentials, no bucket.
#
# The version matrix is computed (scripts/ci-matrix.mjs) from readme.txt's
# "Requires at least" / "Requires PHP", the WordPress.org API and the PHP
# versions core supports: nothing here needs editing when they change.
# Pull requests run a reduced matrix; the weekly run, a PR labelled
# "full matrix" and a manual run with "full" run every combination.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.wordpress-org/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.wordpress-org/**'
  # Weekly, so a new WordPress nightly or PHP release that breaks something
  # shows up before a user reports it.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      wordpress:
        description: 'WordPress version for the extra "next" job, e.g. 7.2-RC3 (default: nightly)'
        required: false
        default: 'nightly'
      full:
        description: 'Run the full matrix (every PHP × WordPress × single/multisite)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          # The lowest supported PHP, as Gutenberg runs its PHPCS.
          php-version: '8.1'
          coverage: none
          tools: composer, cs2pr

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Dependencies that ship in the plugin zip (vendor/, no dev tools).
      - name: Composer audit
        run: composer audit --no-dev --locked

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Production npm dependencies. Advisories in packages that never ship
      # are fixed with overrides in pnpm-workspace.yaml, never ignored.
      - name: pnpm audit
        run: pnpm audit --prod

      # Before PHPStan: includes/Admin/Settings.php includes build/index.asset.php.
      - name: Build
        run: pnpm build

      - name: PHPStan
        run: composer phpstan -- --no-progress --error-format=github

      # Weekly-flushed PHPCS cache, as wordpress-develop and Gutenberg do.
      - name: Week for the PHPCS cache key
        id: week
        run: echo "date=$(/bin/date -u --date='last Mon' '+%F')" >> "$GITHUB_OUTPUT"

      - name: PHPCS cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/phpcs.json
          key: ${{ runner.os }}-${{ steps.week.outputs.date }}-phpcs-${{ hashFiles( 'composer.lock', 'phpcs.xml.dist' ) }}

      # WPCS + PHPCompatibilityWP (phpcs.xml.dist). Findings also show as
      # inline annotations on the PR (cs2pr).
      - name: PHPCS
        id: phpcs
        run: |
          mkdir -p .cache
          vendor/bin/phpcs -q --report-full --report-checkstyle=.cache/phpcs-report.xml --cache=.cache/phpcs.json

      - name: PHPCS annotations
        if: ${{ always() && steps.phpcs.outcome == 'failure' }}
        run: cs2pr .cache/phpcs-report.xml

      - name: TypeScript
        run: pnpm check-types

      - name: ESLint
        run: pnpm lint:js

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # The exact zip a release ships (scripts/bundle.js: production build,
      # composer --no-dev, .distignore'd files removed).
      - name: Build the release zip
        run: |
          pnpm bundle
          mkdir -p plugin-check-build
          unzip -q omnioffloader.zip -d plugin-check-build

      # The WordPress.org directory rules. Errors fail the job; warnings show
      # as annotations. Known warnings: three PluginCheck.Security.DirectDB.
      # UnescapedDBParameter in Core/Helpers.php, where the SQL is built by
      # $wpdb->prepare() in elsewhere_sql() — Plugin Check can't follow it.
      - name: Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: './plugin-check-build/omnioffloader'

  versions:
    name: Version matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            readme.txt
            scripts

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Compute the matrix
        id: matrix
        env:
          FULL: ${{ github.event_name == 'schedule' || ( github.event_name == 'workflow_dispatch' && inputs.full ) || ( github.event_name == 'pull_request' && contains( github.event.pull_request.labels.*.name, 'full matrix' ) ) }}
          NEXT_WP: ${{ inputs.wordpress }}
        run: node scripts/ci-matrix.mjs

  integration:
    name: >-
      Integration (PHP ${{ matrix.php }} · WP ${{ matrix.wp }}${{ matrix.multisite && ' · multisite' || '' }}${{ matrix.object_cache && ' · Redis' || '' }}${{ matrix.db != 'mysql:8.0' && format( ' · {0}', matrix.db ) || '' }})
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # A job marked experimental (WordPress nightly or a chosen version, a PHP
    # core supports only from its next major) reports without failing the run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON( needs.versions.outputs.matrix ) }}

    services:
      mysql:
        # mysql:5.7 (oldest WordPress), mysql:8.0, or mariadb:10.6, each pinned
        # by digest in scripts/ci-matrix.mjs. The MariaDB image still reads the
        # MYSQL_* variables.
        image: ${{ matrix.db_image }} # zizmor: ignore[unpinned-images]
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # Only the object-cache job uses it; starting it everywhere keeps the
      # job definition simple and costs a few seconds.
      redis:
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      WP_PATH: /tmp/wordpress
      WP_VERSION: ${{ matrix.wp }}
      MULTISITE: ${{ matrix.multisite }}
      OBJECT_CACHE: ${{ matrix.object_cache }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: omnioffloader
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd, curl, mbstring, zip, intl
          ini-values: memory_limit=512M
          coverage: none
          tools: composer, wp-cli

      - name: Install Composer dependencies
        working-directory: omnioffloader
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Install WordPress ${{ matrix.wp }}
        run: |
          wp core download --path="$WP_PATH" --version="$WP_VERSION" --skip-content
          mkdir -p "$WP_PATH/wp-content/plugins" "$WP_PATH/wp-content/uploads"
          wp config create --path="$WP_PATH" --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          # Notices print to the output, where the test runner fails on any
          # that come from the plugin's own code.
          wp config set --path="$WP_PATH" WP_DEBUG true --raw
          if [ "$MULTISITE" = 'true' ]; then
            wp core multisite-install --path="$WP_PATH" --url=http://localhost --title=OmniOffloader-CI \
              --admin_user=admin --admin_password=admin --admin_email=ci@example.com --skip-email
            # A sub-site, where the per-site queue prefix and switch_to_blog() paths run.
            wp site create --path="$WP_PATH" --slug=sub --title=Sub --email=ci@example.com
          else
            wp core install --path="$WP_PATH" --url=http://localhost --title=OmniOffloader-CI \
              --admin_user=admin --admin_password=admin --admin_email=ci@example.com --skip-email
          fi
          echo "WordPress $(wp core version --path="$WP_PATH") on PHP $(php -r 'echo PHP_VERSION;')"
          wp db query --path="$WP_PATH" 'SELECT VERSION();' --skip-column-names

      - name: Enable the Redis object cache
        if: ${{ matrix.object_cache }}
        run: |
          wp plugin install redis-cache --activate --path="$WP_PATH"
          wp config set --path="$WP_PATH" WP_REDIS_HOST 127.0.0.1
          # Predis ships with the plugin, so no PHP extension is needed.
          wp config set --path="$WP_PATH" WP_REDIS_CLIENT predis
          wp redis enable --path="$WP_PATH"
          wp redis status --path="$WP_PATH"
          wp eval --path="$WP_PATH" 'if ( ! wp_using_ext_object_cache() ) { WP_CLI::error( "The object cache drop-in is not active." ); }'

      - name: Activate the plugin
        run: |
          ln -s "$GITHUB_WORKSPACE/omnioffloader" "$WP_PATH/wp-content/plugins/omnioffloader"
          wp --path="$WP_PATH" --exec="define( 'OMNIOFFLOADER_DISABLE_ENGINE', true );" plugin activate omnioffloader
          if [ "$MULTISITE" = 'true' ]; then
            wp --path="$WP_PATH" --url=http://localhost/sub/ --exec="define( 'OMNIOFFLOADER_DISABLE_ENGINE', true );" plugin activate omnioffloader
          fi

      - name: Integration tests
        run: omnioffloader/scripts/integration-tests.sh "$WP_PATH"

      - name: Integration tests (multisite sub-site)
        if: ${{ matrix.multisite }}
        env:
          WP_URL: http://localhost/sub/
        run: omnioffloader/scripts/integration-tests.sh "$WP_PATH"

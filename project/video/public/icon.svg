<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="OmniOffloader">
  <defs>
    <linearGradient id="smo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b86ee"/>
      <stop offset=".48" stop-color="#1a5fd6"/>
      <stop offset="1" stop-color="#0e3f9e"/>
    </linearGradient>
    <radialGradient id="smo-glow" cx=".26" cy=".16" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smo-cloud" gradientUnits="userSpaceOnUse" x1="128" y1="36" x2="128" y2="215">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d5e6ff"/>
    </linearGradient>
    <!-- breaks the ring where the cloud crosses it -->
    <mask id="smo-ring">
      <rect width="256" height="256" fill="#ffffff"/>
      <g fill="#000000" transform="translate(128,62) scale(0.84) translate(-128,-78)">
        <circle cx="100" cy="84" r="24"/><circle cx="128" cy="72" r="32"/>
        <circle cx="156" cy="88" r="24"/><rect x="76" y="88" width="104" height="28" rx="14"/>
      </g>
    </mask>
  </defs>

  <rect width="256" height="256" rx="60" fill="url(#smo-bg)"/>
  <rect width="256" height="256" rx="60" fill="url(#smo-glow)"/>

  <!-- "O" for Omni -->
  <circle cx="128" cy="144" r="66" fill="none" stroke="#ffffff" stroke-width="20" mask="url(#smo-ring)"/>

  <!-- cloud cap -->
  <g fill="url(#smo-cloud)" transform="translate(128,62) scale(0.70) translate(-128,-78)">
    <circle cx="100" cy="84" r="24"/><circle cx="128" cy="72" r="32"/>
    <circle cx="156" cy="88" r="24"/><rect x="76" y="88" width="104" height="28" rx="14"/>
  </g>

  <!-- offload (up) + bring back (down) -->
  <g fill="#ffffff">
    <path d="M107 108 L127 139.9 H87 Z"/>
    <rect x="99" y="135.9" width="16" height="48.1" rx="8"/>
    <path d="M149 184 L129 152.1 H169 Z"/>
    <rect x="141" y="108" width="16" height="48.1" rx="8"/>
  </g>

  <rect x="1.5" y="1.5" width="253" height="253" rx="58.5" fill="none" stroke="#ffffff" stroke-opacity=".20" stroke-width="3"/>
</svg>
